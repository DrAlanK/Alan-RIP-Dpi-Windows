name: Build & Release Alan-RIP-Dpi (Windows Portable)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v, e.g. 1.5.0)'
        required: true
        default: '1.5.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}") {
            $ver = "${{ inputs.version }}".TrimStart("v", "V")
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v", "V")
          } else {
            $ver = "1.5.0"
          }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "TAG=v$ver" >> $env:GITHUB_ENV
          Write-Host "Building Alan-RIP-Dpi v$ver (tag: v$ver)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          pip install PySide6 requests pillow pyinstaller

      - name: Ensure core binaries (Xray-core & Wintun)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "core" | Out-Null

          if (-not (Test-Path "core\xray.exe")) {
            Write-Host "Downloading latest Xray-core for Windows x64..."
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/XTLS/Xray-core/releases/latest" -Headers @{ "User-Agent" = "Alan-RIP-Dpi-CI" }
            $asset = $rel.assets | Where-Object { $_.name -eq "Xray-windows-64.zip" } | Select-Object -First 1
            if ($asset) {
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "xray_tmp.zip"
              Expand-Archive -Path "xray_tmp.zip" -DestinationPath "xray_tmp" -Force
              foreach ($f in @("xray.exe", "geoip.dat", "geosite.dat")) {
                if (Test-Path "xray_tmp\$f") {
                  Copy-Item "xray_tmp\$f" "core\$f" -Force
                }
              }
              Remove-Item -Recurse -Force "xray_tmp", "xray_tmp.zip"
            }
          }

          if (-not (Test-Path "core\wintun.dll")) {
            Write-Host "Downloading Wintun 0.14.1 amd64..."
            Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun_tmp.zip"
            Expand-Archive -Path "wintun_tmp.zip" -DestinationPath "wintun_tmp" -Force
            Copy-Item "wintun_tmp\wintun\bin\amd64\wintun.dll" "core\wintun.dll" -Force
            Remove-Item -Recurse -Force "wintun_tmp", "wintun_tmp.zip"
          }

          Get-ChildItem "core"

      - name: Build Portable EXE with PyInstaller
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "assets\icon.ico") {
            $iconArg = @("--icon=assets\icon.ico")
          } elseif (Test-Path "assets\logo.ico") {
            $iconArg = @("--icon=assets\logo.ico")
          } elseif (Test-Path "assets\logo.png") {
            python -c "from PIL import Image; Image.open('assets/logo.png').save('assets/app.ico', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
            if (Test-Path "assets\app.ico") {
              $iconArg = @("--icon=assets\app.ico")
            }
          }

          $dataArgs = @()
          if (Test-Path "assets") {
            $dataArgs += "--add-data=assets;assets"
          }

          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "Alan-RIP-Dpi" `
            --collect-submodules alan_dpi `
            @iconArg `
            @dataArgs `
            main.py

          $distDir = "dist\Alan-RIP-Dpi"
          if (Test-Path "core") {
            Copy-Item "core" "$distDir\core" -Recurse -Force
          }
          if (Test-Path "assets") {
            Copy-Item "assets" "$distDir\assets" -Recurse -Force
          }
          foreach ($doc in @("README.md", "LICENSE", "RELEASE_NOTES.md")) {
            if (Test-Path $doc) {
              Copy-Item $doc "$distDir\$doc" -Force
            }
          }

      - name: Package Portable ZIP & SHA256
        shell: pwsh
        run: |
          $zipName = "Alan-RIP-Dpi-v${env:VERSION}-Windows-Portable.zip"
          Compress-Archive -Path "dist\Alan-RIP-Dpi\*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          Write-Host "Packaged $zipName ($hash)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Alan-RIP-Dpi ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            Alan-RIP-Dpi-v${{ env.VERSION }}-Windows-Portable.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
